info:
  name: Update Product
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/products"
  body:
    type: json
    data: |-
      {
        "productId": 101,
        "productName": "Miojo Sabor Galinha",
        "productPrice": 1.99  
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
